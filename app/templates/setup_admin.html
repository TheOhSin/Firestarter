{% extends "base.html" %}

{% block content %}

<div class="auth-wrap">
    <section class="card auth-card">

        <div class="eyebrow">
            First-run setup
        </div>

        <h1>Create administrator</h1>

        <p class="lead">
            Create the administrator account
            you will use to manage Firestarter.
        </p>

        <div class="notice">
            This account controls the Firestarter WebUI.
            Store these credentials somewhere safe.
        </div>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form
            action="/setup/admin"
            method="post"
            class="form-stack"
        >
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}"
            >

            <label>
                Admin username

                <input
                    name="username"
                    autocomplete="username"
                    placeholder="admin"
                    minlength="3"
                    maxlength="32"
                    required
                    autofocus
                >
            </label>

            <label>
                Admin password

                <input
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </label>

            <label>
                Confirm password

                <input
                    name="confirm_password"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </label>

            <button
                type="submit"
                class="button button-primary"
            >
                Create administrator
            </button>

        </form>

    </section>
</div>

{% endblock %}
