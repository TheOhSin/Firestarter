services:
  firestarter:
    image: ghcr.io/theohsin/firestarter:${APP_VERSION:-1.0.0-rc1}
    container_name: ${FIRESTARTER_CONTAINER_NAME:-firestarter}

    restart: unless-stopped

    ports:
      - "${FIRESTARTER_BIND_IP:-127.0.0.1}:${WEB_PORT:-8090}:${WEB_PORT:-8090}"

    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/data/bot.db}
      WEB_PORT: ${WEB_PORT:-8090}
      WEB_SECURE_COOKIES: ${WEB_SECURE_COOKIES:-false}

    volumes:
      - "${FIRESTARTER_DATA_DIR:-./data}:/data"

    extra_hosts:
      - "${FIRESHARE_HOST_ALIAS:-host.docker.internal}:host-gateway"

    read_only: true

    tmpfs:
      - /tmp

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true
